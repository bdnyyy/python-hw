
name: Python CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./kmeans_laba[dev]"

      - name: Check code with Ruff
        working-directory: kmeans_laba
        run: python -m ruff check kmeans tests

      - name: Check formatting
        working-directory: kmeans_laba
        run: python -m ruff format --check kmeans tests

      - name: Check types with Mypy
        working-directory: kmeans_laba
        run: python -m mypy --strict kmeans tests

      - name: Run tests
        working-directory: kmeans_laba
        run: python -m pytest -v
