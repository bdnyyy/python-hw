
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kmeans-laba"
version = "0.1.0"
description = "K-means clustering algorithm"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "matplotlib>=3.7"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10"
]

[tool.setuptools.packages.find]
include = ["kmeans*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
